'ci':
  - changed-files:
    - any-glob-to-any-file: ['.github/workflows/**']
'tests':
  - changed-files:
    - any-glob-to-any-file: ['tests/**']
'docs':
  - changed-files:
    - any-glob-to-all-files: ['*.md']
'feature/security':
  - changed-files:
    - any-glob-to-any-file: ['src/isolation/**']
'feature/uhyve-interface':
  - changed-files:
    - any-glob-to-any-file: ['uhyve-interface/**']

'arch/aarch64':
  - changed-files:
    - any-glob-to-any-file: ['src/arch/aarch64/**']
'arch/x86-64':
  - changed-files:
    - any-glob-to-any-file: ['src/arch/x86-64/**']
'arch/risc-v':
  - changed-files:
    - any-glob-to-any-file: ['src/arch/riscv/**']

'platform/linux':
  - changed-files:
    - any-glob-to-any-file: ['src/linux/**']
'platform/macOS':
  - changed-files:
    - any-glob-to-any-file: ['src/macos/**']
